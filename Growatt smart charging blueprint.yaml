blueprint:
  name: "Growatt: Pametno nočno polnjenje baterije (Zanesljiv SPF Fiksni Način)"
  description: "Fiksno polni baterijo ob nočni tarifi z manipulacijo Bat Low / AC to Bat registrov. Prilagojeno za Growatt SPF 6000 ES z varnostnimi zamiki in avtomatsko obnovitvijo registrov."
  domain: automation
  input:
    growatt_soc:
      name: Senzor za % baterije (SOC)
      description: Izberite senzor, ki kaže trenutno napolnjenost (SOC) Growatt baterije.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: battery
    growatt_charge_current:
      name: Tok polnjenja baterije (Number)
      description: Izberite number entiteto za nastavljanje amperov (A).
      selector:
        entity:
          filter:
            - domain: number
    growatt_bat_low_to_uti:
      name: Battery Low to UTI (Number)
      description: Izberite entiteto number.growatt_rs485_battery_bat_low_to_uti
      selector:
        entity:
          filter:
            - domain: number
    growatt_ac_to_bat_volt:
      name: AC to Bat Volt/Porcent (Number)
      description: Izberite entiteto number.growatt_rs485_battery_ac_to_bat_volt
      selector:
        entity:
          filter:
            - domain: number
    offset_percentage:
      name: Odmik od trenutnega SOC (%)
      description: Za koliko % MANJ od trenutnega SOC naj se začasno nastavita parametra, da prisilimo preklop.
      default: 5
      selector:
        number:
          min: 1
          max: 15
          step: 1
          unit_of_measurement: "%"
          mode: slider
    start_time:
      name: Čas začetka polnjenja
      description: Kdaj naj se polnjenje iz omrežja začne (npr. 00:00:00).
      default: "00:00:00"
      selector:
        time: {}
    end_time:
      name: Čas konca polnjenja
      description: Kdaj se polnjenje NEGLEDE na stanje baterije mora zaključiti (npr. 06:00:00).
      default: "06:00:00"
      selector:
        time: {}
    target_soc:
      name: Ciljni % baterije (Drsnik)
      description: Do koliko % naj se baterija napolni zjutraj (če doseže prej kot poteče čas).
      default: 80
      selector:
        number:
          min: 10
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider
    max_charge_current:
      name: Fiksni nočni tok polnjenja (A)
      description: Ročno izbran varni tok (npr. 30A), s katerim bo Growatt polnil celo noč.
      default: 30
      selector:
        number:
          min: 0
          max: 80
          step: 5
          unit_of_measurement: "A"
          mode: box
    default_bat_low:
      name: Privzeta dnevna vrednost Bat Low to UTI (%)
      description: Na koliko % naj se ta parameter ponastavi zjutraj za normalno dnevno delovanje.
      default: 30
      selector:
        number:
          min: 10
          max: 90
          step: 5
          unit_of_measurement: "%"
          mode: box
    default_ac_to_bat:
      name: Privzeta dnevna vrednost AC to Bat Volt (%)
      description: Na koliko % naj se ta parameter ponastavi zjutraj za normalno dnevno delovanje.
      default: 50
      selector:
        number:
          min: 10
          max: 95
          step: 5
          unit_of_measurement: "%"
          mode: box

variables:
  soc_sensor: !input growatt_soc
  offset_val: !input offset_percentage
  max_current_val: !input max_charge_current
  def_bat_low: !input default_bat_low
  def_ac_to_bat: !input default_ac_to_bat

trigger:
  - platform: time
    at: !input start_time
    id: zacetek
  - platform: numeric_state
    entity_id: !input growatt_soc
    above: !input target_soc
    id: konec_soc
  - platform: time
    at: !input end_time
    id: konec_cas

condition: []

action:
  - choose:
      # 1. AKCIJA: ZAČETEK POLNJENJA Ob nastavljeni uri (ali ob ročnem zagonu)
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: zacetek
              # Omogoča zanesljiv ročni zagon preko gumba
              - condition: template
                value_template: "{{ trigger is not defined or trigger.id is not defined or trigger.id not in ['konec_soc', 'konec_cas'] }}"
          - condition: numeric_state
            entity_id: !input growatt_soc
            below: !input target_soc
        sequence:
          # KORAK 1: Nastavimo ročno izbrani nočni tok (npr. 30A)
          - service: number.set_value
            target:
              entity_id: !input growatt_charge_current
            data:
              value: "{{ max_current_val | int }}"
          
          # Zamik 15 sekund, da se vpis toka stabilizira na RS485
          - delay: "00:00:15"
          
          # KORAK 2: Prelisičimo register z znižanjem Bat Low pod realni SOC -> Growatt preklopi na omrežje
          - service: number.set_value
            target:
              entity_id: !input growatt_bat_low_to_uti
            data:
              value: "{{ (states(soc_sensor) | float - (offset_val | float)) | round(0) }}"

      # 2. AKCIJA: POPOLN IZKLOP (Ob doseženem % baterije ALI ob izteku časa)
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: konec_soc
              - condition: trigger
                id: konec_cas
        sequence:
          # KORAK 1: Prelisičimo register z znižanjem AC to Bat pod trenutni SOC -> Growatt spusti omrežje in preklopi na baterijo
          - service: number.set_value
            target:
              entity_id: !input growatt_ac_to_bat_volt
            data:
              value: "{{ (states(soc_sensor) | float - (offset_val | float)) | round(0) }}"
          
          # Zamik 15 sekund, da Growatt varno spusti omrežne releje in preide na baterijsko delovanje
          - delay: "00:00:15"
          
          # KORAK 2: Zapremo tok polnjenja na 0A za maksimalno varnost
          - service: number.set_value
            target:
              entity_id: !input growatt_charge_current
            data:
              value: 0
              
          # Zamik 2 minuti: Počakava, da se jutranje/dnevno stanje popolnoma umiri
          - delay: "00:02:00"
          
          # KORAK 3: PONASTAVITEV REGISTROV NA PRIVZETE DNEVNE VREDNOSTI ZA NASLEDNJI DAN
          - service: number.set_value
            target:
              entity_id: !input growatt_bat_low_to_uti
            data:
              value: "{{ def_bat_low | int }}"
              
          - delay: "00:00:15"
          
          - service: number.set_value
            target:
              entity_id: !input growatt_ac_to_bat_volt
            data:
              value: "{{ def_ac_to_bat | int }}"

mode: parallel
max: 10
