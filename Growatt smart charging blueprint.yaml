blueprint:
  name: "Growatt: Pametno nočno polnjenje baterije (Dinamični SPF Fix)"
  description: "Polni baterijo z manipulacijo registrov ter vključuje dinamično zaščito s pametnim filtrom, ki preprečuje blokado RS485 vodila na SPF 6000 ES."
  domain: automation
  input:
    growatt_soc:
      name: Senzor za % baterije (SOC)
      description: Izberite senzor, ki kaže napolnjenost Growatt baterije.
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: battery
    growatt_charge_current:
      name: Tok polnjenja baterije (Number)
      description: Izberite number entiteto za nastavljanje amperov (A).
      selector:
        entity:
          filter:
            - domain: number
    growatt_bat_low_to_uti:
      name: Battery Low to UTI (Number)
      description: Izberite entiteto number.growatt_rs485_battery_bat_low_to_uti
      selector:
        entity:
          filter:
            - domain: number
    growatt_ac_to_bat_volt:
      name: AC to Bat Volt/Porcent (Number)
      description: Izberite entiteto number.growatt_rs485_battery_ac_to_bat_volt
      selector:
        entity:
          filter:
            - domain: number
    offset_percentage:
      name: Odmik od trenutnega SOC (%)
      description: Za koliko % manj od trenutnega SOC naj se nastavita parametra Bat Low in AC to Bat, da prisilimo preklop.
      default: 5
      selector:
        number:
          min: 1
          max: 15
          step: 1
          unit_of_measurement: "%"
          mode: slider
    shelly_power:
      name: Shelly merilnik skupne moči hiše
      description: Izberite senzor skupne porabe hiše v Wattih (W).
      selector:
        entity:
          filter:
            - domain: sensor
              device_class: power
    start_time:
      name: Čas začetka polnjenja
      description: Kdaj naj se polnjenje iz omrežja začne.
      default: "00:00:00"
      selector:
        time: {}
    end_time:
      name: Čas konca polnjenja
      description: Kdaj se cenejša tarifa izteče.
      default: "06:00:00"
      selector:
        time: {}
    target_soc:
      name: Ciljni % baterije (Drsnik)
      description: Do koliko % naj se baterija napolni zjutraj.
      default: 80
      selector:
        number:
          min: 10
          max: 100
          step: 5
          unit_of_measurement: "%"
          mode: slider
    max_grid_power:
      name: Kritična moč priključka (W)
      description: Meja (npr. 3000 W), nad katero se polnjenje takoj zmanjša/ustavi.
      default: 3000
      selector:
        number:
          min: 1000
          max: 10000
          step: 100
          unit_of_measurement: "W"
          mode: box
    max_charge_current:
      name: Maksimalni varni tok polnjenja (A)
      description: Vpišite največji nočni tok (npr. 30A ali 40A), ki ga sistem uporabi, ko je poraba nizka.
      default: 30
      selector:
        number:
          min: 10
          max: 80
          step: 10
          unit_of_measurement: "A"
          mode: box

variables:
  soc_sensor: !input growatt_soc
  offset_val: !input offset_percentage
  max_current_val: !input max_charge_current
  current_entity: !input growatt_charge_current

trigger:
  - platform: time
    at: !input start_time
    id: zacetek
  - platform: numeric_state
    entity_id: !input growatt_soc
    above: !input target_soc
    id: konec_soc
  - platform: time
    at: !input end_time
    id: konec_cas
  - platform: time_pattern
    minutes: "/1"
    id: preverjanje_moci

condition: []

action:
  - choose:
      # 1. AKCIJA: Začetek polnjenja ob nastavljeni uri (ali ob ročnem zagonu)
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: zacetek
              - condition: template
                value_template: "{{ trigger is not defined or trigger.id is not defined or trigger.id not in ['konec_soc', 'konec_cas', 'preverjanje_moci'] }}"
          - condition: numeric_state
            entity_id: !input growatt_soc
            below: !input target_soc
        sequence:
          # Najprej nastavimo začetni tok na 20A
          - service: number.set_value
            target:
              entity_id: !input growatt_charge_current
            data:
              value: 20
          - delay: "00:00:03"
          # Prisili preklop na omrežje z znižanjem Bat Low pod realni SOC
          - service: number.set_value
            target:
              entity_id: !input growatt_bat_low_to_uti
            data:
              value: "{{ (states(soc_sensor) | float - (offset_val | float)) | round(0) }}"

      # 2. AKCIJA: Dinamična zaščita (Izvaja se vsako minuto LE ZNOTRAJ časovnega okna ali ko polni)
      - conditions:
          - condition: trigger
            id: preverjanje_moci
          - condition: numeric_state
            entity_id: !input growatt_soc
            below: !input target_soc
          - condition: or
            conditions:
              - condition: time
                after: !input start_time
                before: !input end_time
              - condition: numeric_state
                entity_id: !input growatt_charge_current
                above: 0
        sequence:
          - choose:
              # STOPNJA 1: Poraba presega kritično mejo (npr. priklop EV) -> Zmanjšaj na 0A
              - conditions:
                  - condition: numeric_state
                    entity_id: !input shelly_power
                    above: !input max_grid_power
                  # Pametni filter: Ukaz pošljemo le, če tok že ni na 0A
                  - condition: template
                    value_template: "{{ states(current_entity) | int != 0 }}"
                sequence:
                  - service: number.set_value
                    target:
                      entity_id: !input growatt_charge_current
                    data:
                      value: 0

              # STOPNJA 2: Poraba je visoka, a pod kritično mejo (npr. med 2400W in 3000W) -> Omeji na 10A
              - conditions:
                  - condition: numeric_state
                    entity_id: !input shelly_power
                    above: 2400
                  - condition: numeric_state
                    entity_id: !input shelly_power
                    below: !input max_grid_power
                  # Pametni filter: Ukaz pošljemo le, če tok že ni na 10A
                  - condition: template
                    value_template: "{{ states(current_entity) | int != 10 }}"
                sequence:
                  - service: number.set_value
                    target:
                      entity_id: !input growatt_charge_current
                    data:
                      value: 10

              # STOPNJA 3: Poraba je zmerna (npr. med 1500W in 2400W) -> Nastavi na 20A
              - conditions:
                  - condition: numeric_state
                    entity_id: !input shelly_power
                    above: 1500
                  - condition: numeric_state
                    entity_id: !input shelly_power
                    below: 2400
                  # Pametni filter: Ukaz pošljemo le, če tok že ni na 20A
                  - condition: template
                    value_template: "{{ states(current_entity) | int != 20 }}"
                sequence:
                  - service: number.set_value
                    target:
                      entity_id: !input growatt_charge_current
                    data:
                      value: 20

              # STOPNJA 4: Varno območje (Poraba hiše je nizka, pod 1500W) -> Dvigni na maksimalni varni tok
              - conditions:
                  - condition: numeric_state
                    entity_id: !input shelly_power
                    below: 1500
                  # Pametni filter: Ukaz pošljemo le, če tok že ni na max vrednosti
                  - condition: template
                    value_template: "{{ states(current_entity) | int != (max_current_val | int) }}"
                sequence:
                  - service: number.set_value
                    target:
                      entity_id: !input growatt_charge_current
                    data:
                      value: "{{ max_current_val | int }}"

      # 3. AKCIJA: Popoln izklop ob doseženem % baterije ali koncu ure
      - conditions:
          - condition: or
            conditions:
              - condition: trigger
                id: konec_soc
              - condition: trigger
                id: konec_cas
        sequence:
          # Prisili preklop nazaj na razsmernik z znižanjem AC to Bat pod trenutni SOC
          - service: number.set_value
            target:
              entity_id: !input growatt_ac_to_bat_volt
            data:
              value: "{{ (states(soc_sensor) | float - (offset_val | float)) | round(0) }}"
          - delay: "00:00:03"
          # Popolnoma zapremo tok polnjenja na 0A
          - service: number.set_value
            target:
              entity_id: !input growatt_charge_current
            data:
              value: 0

mode: parallel
max: 10
