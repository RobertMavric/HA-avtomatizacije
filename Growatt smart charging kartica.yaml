type: vertical-stack
cards:
  - type: grid
    columns: 2
    square: false
    cards:
      
      # 1. Stanje baterije (Rdeča <= 30 %, Rumena 31–60 %, Zelena > 60 %)
      - type: tile
        entity: sensor.growatt_rs485_battery_battery_soc
        name: Stanje baterije
        icon: mdi:battery
        card_mod:
          style: |
            ha-card {
              {% set soc = states('sensor.growatt_rs485_battery_battery_soc') | int(0) %}
              {% if soc <= 30 %}
                --tile-color: red !important; 
              {% elif soc <= 60 %}
                --tile-color: yellow !important; 
              {% else %}
                --tile-color: green !important;  
              {% endif %}
            }
        #
      - type: tile
        entity: automation.growatt_pametno_jutranje_polnjenje_baterije
        name: Pametno polnjenje
        icon: mdi:robot-text
        color: green
        #
      - type: tile
        entity: sensor.growatt_rs485_solar_solar_total_power
        name: Solarna moč
        icon: mdi:solar-power
        card_mod:
          style: |
            ha-card {
              {% set solar = states('sensor.growatt_rs485_solar_solar_total_power') | float(0) %}
              {% if solar <= 50 %}
                --tile-color: grey !important;
              {% elif solar <= 200 %}
                --tile-color: orange !important;
              {% elif solar <= 500 %}
                --tile-color: gold !important;
              {% else %}
                --tile-color: yellow !important;
              {% endif %}
            }
    #
      - type: tile
        entity: sensor.growatt_rs485_grid_ac_input_power
        name: Vhodna moč
        icon: mdi:power-plug
        card_mod:
          style: |
           ha-tile-icon {
             {% if states('sensor.growatt_rs485_grid_ac_input_power') | float(0) >= 3000 %}
               --tile-color: red !important;
             {% else %}
               --tile-color: green !important;
            {% endif %}
            }
        #
      - type: tile
        entity: sensor.growatt_rs485_solar_ac_power
        name: Izhodna moč
        icon: mdi:power-plug
        card_mod:
          style: |
           ha-tile-icon {
             {% if states('sensor.growatt_rs485_solar_ac_power') | float(0) >= 4000 %}
               --tile-color: red !important;
             {% else %}
               --tile-color: green !important;
            {% endif %}
            }
        #
      - type: tile
        entity: sensor.growatt_rs485_grid_grid_voltage
        name: Vhodna napetost
        icon: mdi:power-plug
        card_mod:
          style: |
           ha-tile-icon {
             {% if states('sensor.growatt_rs485_grid_grid_voltage') | float(0) >= 150 %}
               --tile-color: green !important;
             {% else %}
               --tile-color: red !important;
            {% endif %}
            }
  - type: tile
    entity: number.growatt_rs485_battery_bat_low_to_uti
    name: Minimalna napolnjenost baterije (AC)
    icon: mdi:battery-charging
    card_mod:
      style: |
        ha-card {
          border-bottom-left-radius: 0px !important;
          border-bottom-right-radius: 0px !important;
          padding-bottom: 4px !important;
        }
  - type: grid
    columns: 4
    square: false
    cards:
      - type: button
        name: 50%
        tap_action:
          action: call-service
          service: number.set_value
          target:
            entity_id: number.growatt_rs485_battery_bat_low_to_uti
          data:
            value: 50
        card_mod:
          style: |
            ha-card {
              height: 40px !important;
              box-shadow: none !important;
              border: none !important;
              font-weight: bold !important;
              {% if states('number.growatt_rs485_battery_bat_low_to_uti') | int == 50 %}
                background: var(--accent-color, #7e57c2) !important;
                color: #ffffff !important;
              {% else %}
                background: rgba(255, 255, 255, 0.05) !important;
              {% endif %}
            }
      - type: button
