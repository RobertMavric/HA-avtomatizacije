  - type: tile
    entity: number.growatt_rs485_battery_ac_charge_current
    name: Moč polnjenja baterije (AC)
    icon: mdi:current-ac
    card_mod:
      style: |
        ha-card {
          border-bottom-left-radius: 0px !important;
          border-bottom-right-radius: 0px !important;
          padding-bottom: 4px !important;
        }
        .icon-container {
          {% if states('number.growatt_rs485_battery_ac_charge_current') | int == 10 %}
            --tile-color: #ffc107 !important;
          {% elif states('number.growatt_rs485_battery_ac_charge_current') | int in [20, 30] %}
            --tile-color: #2e7d32 !important;
          {% elif states('number.growatt_rs485_battery_ac_charge_current') | int == 40 %}
            --tile-color: #d32f2f !important;
            animation: blinker 1.5s linear infinite;
          {% endif %}
        }
        @keyframes blinker {
          50% { opacity: 0.3; }
        }
